[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"
description = "Same-machine Windows orchestrator for multi-harness conductor-track workflows"
repository = "https://github.com/Ryan-AI-Studios/Coordinator"
readme = "README.md"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dunce = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
