[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"
description = "Same-machine Windows orchestrator for multi-harness conductor-track workflows"
repository = "https://github.com/Ryan-AI-Studios/Coordinator"
readme = "README.md"

[features]
default = ["ui"]
ui = ["dep:dioxus"]

[dependencies]
dioxus = { version = "0.7.10", optional = true, features = ["desktop"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dunce = "1.0.5"
hmac-sha256 = "1.1.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
ureq = { version = "3.4.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
